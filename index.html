<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Loja de Roupas</title>
</head>

<body>

    <h1>Loja de Roupas</h1>

    <h2>Cadastrar produto</h2>

    <input id="nome" placeholder="Nome do produto">

    <button onclick="salvar()">
        Salvar
    </button>

    <p id="mensagem"></p>

    <h2>Produtos cadastrados</h2>

    <ul id="lista"></ul>

    <script src="script.js"></script>
```html
<h2>Cadastrar preço</h2>

<input
    type="number"
    id="valor"
    placeholder="Digite o preço do produto"
    step="0.01"
    min="0"
>

<button onclick="salvarPreco()">
    Salvar preço
</button>

<p id="mensagemPreco"></p>

<h2>Preços cadastrados</h2>

<ul id="listaPrecos"></ul>
```
</body>
